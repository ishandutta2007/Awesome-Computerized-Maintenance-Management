<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Dynamic Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="16"/>

  <!-- Dynamic / Animated Background Wave Elements (Behind Text) -->
  <g opacity="0.4">
    <!-- Animated Wave 1 -->
    <path d="M-100 220 Q 200 120 500 240 T 1100 180 T 1300 260" fill="none" stroke="url(#titleGrad)" stroke-width="3" opacity="0.6">
      <animate attributeName="d" 
        values="M-100 220 Q 200 120 500 240 T 1100 180 T 1300 260;
                M-100 180 Q 250 260 550 160 T 1050 220 T 1300 180;
                M-100 220 Q 200 120 500 240 T 1100 180 T 1300 260" 
        dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Animated Wave 2 -->
    <path d="M-100 120 Q 300 280 700 140 T 1300 200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-dasharray="8 6">
      <animate attributeName="d" 
        values="M-100 120 Q 300 280 700 140 T 1300 200;
                M-100 240 Q 350 100 650 260 T 1300 150;
                M-100 120 Q 300 280 700 140 T 1300 200" 
        dur="16s" repeatCount="indefinite" />
    </path>
    
    <!-- Floating Tech Nodes / Pulse Circles -->
    <circle cx="150" cy="80" r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="240" r="5" fill="#c084fc" filter="url(#softGlow)">
      <animate attributeName="r" values="4;9;4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="70" r="3" fill="#818cf8" filter="url(#softGlow)">
      <animate attributeName="r" values="2;6;2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Container -->
  <g text-anchor="middle">
    <!-- Top Pill / Tag -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
        ⚙️ CMMS &amp; EAM ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome CMMS Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Curated SaaS Leaders, Open-Source Maintenance Software &amp; Asset Operations
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(600, 245)">
      <!-- Item 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🛠️ Work Orders</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📦 Inventory</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(75, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📅 Preventive Maint.</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(240, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🌐 Open Source</text>
      </g>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#334155" stroke-width="2" rx="16"/>
</svg>
